[project]
name = "control-layer"
version = "0.1.0"
description = "Local policy-governed interaction foundation"
authors = []
dynamic = ["dependencies"]
requires-python = ">=3.12,<4.0"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.135"
pydantic = "^2.12"
PyYAML = "^6.0"
uvicorn = "^0.41"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
httpx = "^0.28"
ruff = "^0.15"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
