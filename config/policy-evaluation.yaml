# Evaluation profile: every control enabled, small usage limits that are easy to exceed.
# Semantic inspection needs a provisioned local Ollama evaluator (see README); for a
# model-free run use config/policy-evaluation-offline.yaml, which differs only in that
# semantic-security is disabled.
version: 1
policy_id: evaluation-strict
controls:
  email-address:
    enabled: true
    findings:
      pii.email: REDACT
  bearer-credential:
    enabled: true
    findings:
      secret.bearer: BLOCK
  pem-private-key:
    enabled: true
    findings:
      secret.pem_private_key: BLOCK
  github-token:
    enabled: true
    findings:
      secret.github_pat: BLOCK
      secret.github_oauth: BLOCK
  us-ssn:
    enabled: true
    findings:
      pii.us_ssn: REDACT
  known-attack-signatures:
    enabled: true
    findings:
      attack.pickle_os_system: BLOCK
      attack.pickle_posix_system: BLOCK
      attack.python_os_system: BLOCK
      attack.python_exec_base64: BLOCK

  # 20 requests or 2,000 estimated tokens per minute; a single request over 400 estimated
  # tokens (about 1,600 characters) is rejected. Change `BLOCK` to `ALLOW` for observe-only.
  usage-budget:
    enabled: true
    limits:
      window_seconds: 60
      max_requests: 20
      max_estimated_tokens: 2000
      max_request_tokens: 400
    findings:
      budget.request_limit: BLOCK
      budget.token_limit: BLOCK
      budget.request_size: BLOCK

  semantic-security:
    enabled: true
    threshold: 0.75
    findings:
      semantic.prompt_injection: BLOCK
      semantic.instruction_override: BLOCK
      semantic.exfiltration_intent: BLOCK
