# Same as policy-evaluation.yaml but with semantic-security disabled, so the whole
# evaluation (including budgets) runs with the echo target and no model runtime.
version: 1
policy_id: evaluation-offline
controls:
  email-address:
    enabled: true
    findings:
      pii.email: REDACT
  bearer-credential:
    enabled: true
    findings:
      secret.bearer: BLOCK
  pem-private-key:
    enabled: true
    findings:
      secret.pem_private_key: BLOCK
  github-token:
    enabled: true
    findings:
      secret.github_pat: BLOCK
      secret.github_oauth: BLOCK
  us-ssn:
    enabled: true
    findings:
      pii.us_ssn: REDACT
  known-attack-signatures:
    enabled: true
    findings:
      attack.pickle_os_system: BLOCK
      attack.pickle_posix_system: BLOCK
      attack.python_os_system: BLOCK
      attack.python_exec_base64: BLOCK

  usage-budget:
    enabled: true
    limits:
      window_seconds: 60
      max_requests: 20
      max_estimated_tokens: 2000
      max_request_tokens: 400
    findings:
      budget.request_limit: BLOCK
      budget.token_limit: BLOCK
      budget.request_size: BLOCK

  semantic-security:
    enabled: false
    findings: {}
